<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1517" />
    <meta
      name="description"
      content="Ciudades Sagradas: reconstrucciones 3D de los grandes centros ceremoniales del Perú antiguo."
    />
    <title>Ciudades Sagradas</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="loading" class="loading" role="status" aria-live="polite" hidden>
      <div class="loading__mark" aria-hidden="true"></div>
      <p id="loading-text">Cargando la ciudad…</p>
      <div class="loading__bar"><span id="loading-bar"></span></div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript>Este atlas necesita JavaScript para mostrar las reconstrucciones 3D.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
