name: Nightly QA

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-qa
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run qa:playwright:review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-nightly
          path: |
            playwright-report/
            qa-output/
          if-no-files-found: ignore
